{% extends "base.html" %}
{% block title %}Log in | Examination Management Portal{% endblock %}
{% block content %}
<div class="panel auth-box">
  <h1>Log in</h1>
  <p class="text-muted">Admin, examiners and students all log in here.</p>
  <form method="post">
    <div class="mb-3">
      <label class="form-label" for="identifier">Username or email</label>
      <input class="form-control" type="text" id="identifier" name="identifier" value="{{ identifier }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0 text-muted">
    New here? Register as a <a href="{{ url_for('auth.register_student') }}">student</a>
    or an <a href="{{ url_for('auth.register_examiner') }}">examiner</a>.
  </p>
</div>
{% endblock %}
